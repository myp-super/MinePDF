name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # winCodeSign 解压符号链接包装器（无管理员权限的 Windows 需要）
      - name: Patch 7za wrapper
        shell: pwsh
        run: |
          Copy-Item node_modules\7zip-bin\win\x64\7za.exe node_modules\7zip-bin\win\x64\7za-real.exe
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:$env:RUNNER_TEMP\7za-wrap.exe scripts\7za-wrap.cs
          Copy-Item $env:RUNNER_TEMP\7za-wrap.exe node_modules\7zip-bin\win\x64\7za.exe

      - name: Build & package
        id: build
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath dist-log.txt
          if ($LASTEXITCODE -ne 0) {
            "## Build failed (log tail)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content dist-log.txt -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $LASTEXITCODE
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MinePDF Setup *.exe
            release/MinePDF *Portable*.exe
          generate_release_notes: true

      # 把本次版本的 update.json 提交回 main，GitHub Pages 自动重新部署
      - name: Update update.json on main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          # GitHub 会把 Release 附件名中的空格规范为点号，链接必须用点号格式
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/MinePDF.Setup.$ver.exe"
          # 用标签自身提交的说明，而不是 checkout main 后的 HEAD：
          # 两个 release 并发时，后者若用 git log -1 会取到前者的 chore 提交，notes 会串版本
          $subject = (git show -s --format=%s "refs/tags/$env:GITHUB_REF_NAME") -replace '^release:\s*',''
          $json = @{
            version = $ver
            notes = @($subject)
            url = $url
            publishDate = (Get-Date -Format 'yyyy-MM-dd')
          } | ConvertTo-Json
          Set-Content -Path update.json -Value $json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update update.json for $env:GITHUB_REF_NAME"
            git push origin main
          }
